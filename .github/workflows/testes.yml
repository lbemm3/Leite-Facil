# LeiteFácil — roda os testes automatizados a cada vez que alguém sobe
# código novo no GitHub. Não precisa fazer nada manualmente: depois de um
# "commit", abra a aba "Actions" no GitHub para ver uma marca verde (✅,
# passou) ou vermelha (❌, algum cálculo não bateu com o esperado).
#
# Este arquivo precisa ficar exatamente neste caminho dentro do repositório:
# .github/workflows/testes.yml
#
# São três testes: os cálculos do app (testar-calculos.js), as regras da função
# dos avisos das 7h (testar-avisos-diarios.js) e a equivalência entre as regras
# de cio do app e as da função (testar-equivalencia-cio.js). Os dois últimos
# precisam do Node 22.13 ou mais novo, por isso a versão abaixo é a 22.

name: Testes automatizados

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  testar-calculos:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4
      - name: Preparar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rodar os testes de cálculo
        run: node testes/testar-calculos.js
      - name: Rodar os testes dos avisos das 7h
        run: node testes/testar-avisos-diarios.js
      - name: Conferir que as regras de cio do app e da função são iguais
        run: node testes/testar-equivalencia-cio.js
