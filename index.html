<!DOCTYPE html>
<html lang="pt-BR">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LeiteFácil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="manifest" href="manifest.json">

<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<style>
  :root{
    --creme: #FAF6EC;
    --creme-alt: #F1EADA;
    --azul: #2E5A82;
    --azul-escuro: #1B3A54;
    --azul-claro: #6C93B5;
    --manteiga: #E7B23F;
    --manteiga-escura: #C4922A;
    --pasto: #587A4E;
    --celeiro: #8A5A3B;
    --tinta: #23201A;
    --tinta-suave: #635C4F;
    --zinco: #8A8577;
    --zinco-claro: #DEDACB;
    --branco: #FFFEFA;
    --perigo: #A6402D;
    --sucesso: #3F7D4A;
    --sombra: 0 18px 44px rgba(27,58,84,0.16);
    --sombra-sm: 0 4px 10px rgba(35,32,26,0.10);
    --raio-sm: 10px;
    --raio-md: 16px;
    --raio-lg: 24px;
    --fonte-titulo: 'Fraunces', serif;
    --fonte-corpo: 'Inter', sans-serif;
    --fonte-dados: 'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family: var(--fonte-corpo);
    color: var(--tinta);
    background: var(--creme);
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  button{ font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }
  input, textarea, select{ font-family:inherit; font-size:15px; }
  :focus-visible{ outline:3px solid var(--manteiga); outline-offset:2px; border-radius:6px; }
  @media (prefers-reduced-motion: reduce){ *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; } }
  .oculto{ display:none !important; }

  #pagina-login{
    position:fixed; inset:0; z-index:60;
    display:flex; align-items:center; justify-content:center;
    padding:24px;
    background-color: var(--azul-escuro);
    background-image:
      repeating-linear-gradient(115deg, rgba(255,255,255,0.04) 0px, rgba(255,255,255,0.04) 2px, transparent 2px, transparent 30px),
      linear-gradient(165deg, #35638C 0%, #16324A 100%);
  }
  .cartao-login{
    background: var(--branco);
    width:100%; max-width:420px;
    border-radius: var(--raio-lg);
    padding:40px 34px;
    text-align:center;
    box-shadow: var(--sombra);
  }
  .cartao-login .selo-grande{
    width:72px; height:72px; margin:0 auto 18px;
    background: var(--manteiga); border-radius:20px;
    display:flex; align-items:center; justify-content:center;
    color: var(--azul-escuro); transform: rotate(-4deg);
  }
  .cartao-login .selo-grande svg{ width:34px; height:34px; }
  .cartao-login h1{ font-family: var(--fonte-titulo); font-weight:700; font-size:29px; margin-bottom:8px; }
  .cartao-login .tagline{ color: var(--tinta-suave); font-size:14.5px; line-height:1.5; margin-bottom:26px; }

  #aplicativo{ display:flex; height:100vh; }

  .barra-lateral{
    display:none;
    width:244px; flex-shrink:0;
    background: linear-gradient(180deg, var(--azul) 0%, var(--azul-escuro) 100%);
    color: var(--creme);
    flex-direction:column;
    padding:26px 18px;
  }
  .barra-lateral .lockup{ display:flex; align-items:center; gap:10px; padding:0 6px 30px; }
  .barra-lateral .lockup .selo-icone{ width:36px; height:36px; background:var(--manteiga); border-radius:10px; display:flex; align-items:center; justify-content:center; color:var(--azul-escuro); transform:rotate(-4deg); flex-shrink:0; }
  .barra-lateral .lockup .nome{ font-family:var(--fonte-titulo); font-weight:700; font-size:19px; }
  .barra-lateral .lockup .sub{ font-size:10.5px; font-family:var(--fonte-dados); text-transform:uppercase; letter-spacing:0.5px; color:rgba(250,246,236,0.65); }
  .nav-lateral{ display:flex; flex-direction:column; gap:4px; flex:1; }
  .nav-lateral button{ display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:12px; font-weight:600; font-size:14.5px; color: rgba(250,246,236,0.8); text-align:left; transition: background 0.15s ease, color 0.15s ease; }
  .nav-lateral button svg{ width:19px; height:19px; flex-shrink:0; }
  .nav-lateral button:hover{ background: rgba(255,255,255,0.08); }
  .nav-lateral button.ativo{ background: rgba(255,255,255,0.16); color: var(--branco); }
  .rodape-lateral{ padding-top:16px; border-top:1px dashed rgba(250,246,236,0.25); }
  .rodape-lateral button{ display:flex; align-items:center; gap:12px; padding:11px 14px; border-radius:12px; font-weight:600; font-size:13.5px; color: rgba(250,246,236,0.68); width:100%; text-align:left; }
  .rodape-lateral button svg{ width:17px; height:17px; }
  .rodape-lateral button:hover{ background: rgba(255,255,255,0.08); color:var(--branco); }

  @media (min-width:900px){ .barra-lateral{ display:flex; } }

  .coluna-principal{ flex:1; min-width:0; display:flex; flex-direction:column; height:100vh; }

  .barra-topo{
    flex-shrink:0; display:flex; align-items:center; gap:16px;
    padding:16px 28px; background: var(--branco);
    border-bottom:1.5px solid var(--zinco-claro);
  }
  .barra-topo .logo-mobile{ display:flex; align-items:center; gap:9px; flex-shrink:0; }
  .barra-topo .logo-mobile .selo-icone{ width:32px; height:32px; background:var(--manteiga); border-radius:9px; display:flex; align-items:center; justify-content:center; color:var(--azul-escuro); transform:rotate(-4deg); }
  .barra-topo .logo-mobile .nome{ font-family:var(--fonte-titulo); font-weight:700; font-size:16.5px; }
  @media (min-width:900px){ .barra-topo .logo-mobile{ display:none; } }
  .barra-topo .espaco{ flex:1; }

  .area-conteudo{ flex:1; overflow-y:auto; padding: 30px 30px 110px; }
  @media (min-width:900px){ .area-conteudo{ padding: 34px 40px 40px; } }

  .painel-tela{ display:none; max-width:1100px; }
  .painel-tela.ativa{ display:block; animation: entra 0.22s ease; }
  @keyframes entra{ from{ opacity:0; transform:translateY(8px);} to{ opacity:1; transform:translateY(0);} }

  .saudacao{ font-family: var(--fonte-titulo); font-weight:700; font-size:27px; margin-bottom:4px; }
  .legenda-muted{ color: var(--tinta-suave); font-size:14.5px; margin-bottom:26px; }
  .rotulo-secao{ font-family: var(--fonte-titulo); font-weight:600; font-size:14px; text-transform:uppercase; letter-spacing:0.4px; color: var(--celeiro); margin: 4px 0 14px; }

  .botao{ display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:14px 22px; border-radius:999px; font-weight:700; font-size:14.5px; transition: transform 0.12s ease, filter 0.12s ease; }
  .botao:active{ transform: scale(0.97); }
  .botao svg{ width:18px; height:18px; }
  .botao-primario{ background: var(--azul); color: var(--branco); }
  .botao-primario:hover{ filter: brightness(1.08); }
  .botao-manteiga{ background: var(--manteiga); color: var(--azul-escuro); width:100%; }
  .botao-manteiga:hover{ filter: brightness(1.05); }
  .botao-secundario{ background: var(--creme-alt); color: var(--tinta); border:1.5px solid var(--zinco-claro); }
  .botao-bloco{ width:100%; }
  .botao-perigo-fino{ background:transparent; color: var(--perigo); font-size:13px; font-weight:700; margin-top:8px; display:inline-flex; align-items:center; gap:6px; }

  .cartao{ background: var(--branco); border:1.5px solid var(--zinco-claro); border-radius: var(--raio-md); padding:18px; margin-bottom:14px; }
  .linha-tracejada{ border-top:1.5px dashed var(--zinco-claro); margin:16px 0; }

  .grupo-campo{ margin-bottom:16px; text-align:left; }
  .grupo-campo label{ display:block; font-size:12.5px; font-weight:700; color: var(--tinta-suave); text-transform:uppercase; letter-spacing:0.4px; margin-bottom:6px; }
  .grupo-campo input, .grupo-campo textarea, .grupo-campo select{ width:100%; border:1.5px solid var(--zinco-claro); border-radius: var(--raio-sm); padding:12px 13px; background: var(--branco); color: var(--tinta); }
  .grupo-campo input:focus, .grupo-campo textarea:focus, .grupo-campo select:focus{ border-color: var(--azul); outline:none; }
  .grupo-campo textarea{ resize:vertical; min-height:74px; }
  .item-servico-extra{ display:flex; align-items:center; gap:8px; padding:7px 0; font-size:14px; font-weight:600; color:var(--tinta); cursor:pointer; }
  .item-servico-extra input{ width:auto; flex-shrink:0; margin:0; }

  .capa-perfil{ background: linear-gradient(135deg, var(--azul) 0%, var(--azul-escuro) 100%); border-radius: var(--raio-lg); padding:22px 20px; color: var(--creme); margin-bottom:18px; position:relative; overflow:hidden; }
  .capa-perfil::after{ content:""; position:absolute; inset:0; background-image: repeating-linear-gradient(120deg, rgba(255,255,255,0.05) 0px, rgba(255,255,255,0.05) 2px, transparent 2px, transparent 22px); }
  .capa-perfil .conteudo{ position:relative; display:flex; gap:14px; align-items:center; text-align:left; }
  .avatar{ width:58px; height:58px; border-radius:50%; background: var(--azul); color: var(--creme); font-family: var(--fonte-titulo); font-weight:700; font-size:19px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .capa-perfil .avatar{ background: var(--manteiga); color: var(--azul-escuro); border:3px solid rgba(255,254,250,0.4); }
  .capa-perfil .nome{ font-family: var(--fonte-titulo); font-weight:700; font-size:19px; }
  .capa-perfil .sub{ color: rgba(250,246,236,0.82); font-size:13px; margin-top:2px; }

  .linha-menu{ display:flex; align-items:center; gap:12px; padding:14px 4px; border-bottom:1px dashed var(--zinco-claro); width:100%; text-align:left; }
  .linha-menu:last-child{ border-bottom:none; }
  .linha-menu .ic{ width:34px; height:34px; border-radius:10px; background: var(--creme-alt); color: var(--azul); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .linha-menu .ic svg{ width:18px; height:18px; }
  .linha-menu .txt{ flex:1; font-weight:600; font-size:14.5px; }

  .estado-vazio{ text-align:center; padding: 60px 14px; color: var(--tinta-suave); }
  .estado-vazio .ic{ width:68px; height:68px; margin:0 auto 18px; border-radius:50%; background: var(--creme-alt); color: var(--celeiro); display:flex; align-items:center; justify-content:center; }
  .estado-vazio .ic svg{ width:32px; height:32px; }
  .estado-vazio p{ font-size:14.5px; line-height:1.55; max-width:340px; margin:0 auto 20px; }

  .badge-admin{ display:inline-flex; align-items:center; gap:5px; background: var(--pasto); color: var(--branco); font-size:11px; font-weight:800; padding:4px 10px; border-radius:999px; letter-spacing:0.3px; text-transform:uppercase; }

  table.tabela-admin{ width:100%; border-collapse:collapse; font-size:14px; }
  table.tabela-admin th{ text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:0.4px; color: var(--zinco); padding:10px 8px; border-bottom:1.5px solid var(--zinco-claro); }
  table.tabela-admin td{ padding:12px 8px; border-bottom:1px dashed var(--zinco-claro); }
  table.tabela-admin tr:last-child td{ border-bottom:none; }

  .cartao-estat .num{ font-family: var(--fonte-dados); font-weight:600; font-size:24px; color: var(--azul-escuro); margin-top:6px; }

    #area-impressao .cartao{ border:1px solid #ccc; break-inside:avoid; }
  }

  .nav-inferior-mobile{ display:flex; position:fixed; left:0; right:0; bottom:0; z-index:30; background: var(--branco); border-top:1px dashed var(--zinco-claro); padding: 8px 6px calc(env(safe-area-inset-bottom, 8px) + 8px); }
  @media (min-width:900px){ .nav-inferior-mobile{ display:none; } }

  .nav-inferior-mobile button svg{ width:21px; height:21px; }
  .nav-inferior-mobile button.ativo{ color: var(--azul); background: rgba(46,90,130,0.09); }

  #camada-modal.ativo{ display:flex; }
  .modal{ position:relative; background: var(--branco); width:100%; max-width:480px; max-height:88vh; overflow-y:auto; border-radius: var(--raio-lg); box-shadow: var(--sombra); padding:24px 22px 28px; text-align:center; }
  .modal .fechar-modal{ position:absolute; top:14px; right:14px; width:34px; height:34px; border-radius:50%; background: var(--creme-alt); color:var(--tinta); display:flex; align-items:center; justify-content:center; z-index:2; }
  .modal .fechar-modal svg{ width:17px; height:17px; }
  @media (max-width:640px){
    #camada-modal{ align-items:flex-end; padding:0; }
    .modal{ max-width:100%; border-radius: 26px 26px 0 0; max-height:92vh; animation: subir 0.25s ease; }
  }
  @keyframes subir{ from{ transform: translateY(26px); opacity:0.4; } to{ transform: translateY(0); opacity:1; } }
</style>
</head>
<body>

<div id="pagina-login">
  <div class="cartao-login">
    <div class="selo-grande" id="icone-login"></div>
    <h1>LeiteFácil</h1>
    <p class="tagline">Controle de produção leiteira simples e gratuito, feito para o pequeno produtor.</p>
    <div class="grupo-campo">
      <label for="input-nome">Seu nome (só para criar conta)</label>
      <input id="input-nome" type="text" placeholder="Seu nome completo" autocomplete="name">
    </div>
    <div class="grupo-campo">
      <label for="input-email">E-mail</label>
      <input id="input-email" type="email" placeholder="seuemail@exemplo.com" autocomplete="email">
    </div>
    <div class="grupo-campo">
      <label for="input-senha">Senha</label>
      <input id="input-senha" type="password" placeholder="Sua senha" autocomplete="current-password">
    </div>
    <label class="item-servico-extra" style="text-align:left; align-items:flex-start; margin-bottom:14px;">
      <input type="checkbox" id="input-aceite-termos" style="margin-top:3px;">
      <span>Li e aceito os <a href="#" onclick="event.preventDefault(); abrirTermosDeUso(false);" style="color:var(--azul); font-weight:800; text-decoration:underline;">termos de uso e privacidade</a> (só é obrigatório para criar conta nova).</span>
    </label>
    <div id="mensagem-login" class="legenda-muted" style="min-height:0; margin-bottom:6px;"></div>
    <button class="botao botao-primario botao-bloco" onclick="entrarComEmail()">Entrar</button>
    <button class="botao botao-secundario botao-bloco" style="margin-top:10px" onclick="criarContaComEmail()">Criar conta nova</button>
  </div>
</div>

<div id="aplicativo" class="oculto">
  <aside class="barra-lateral">
    <div class="lockup">
      <div class="selo-icone" id="icone-marca-lateral"></div>
      <div><div class="nome">LeiteFácil</div><div class="sub">Versão web</div></div>
    </div>
    <nav class="nav-lateral" id="nav-lateral"></nav>
  </aside>

  <div class="coluna-principal">
    <header class="barra-topo">
      <div class="logo-mobile">
        <div class="selo-icone" id="icone-marca-topo"></div>
        <div class="nome">LeiteFácil</div>
      </div>
      <div class="espaco"></div>
    </header>

    <main class="area-conteudo">
      <section class="painel-tela ativa" id="tela-inicio"></section>
      <section class="painel-tela" id="tela-animais"></section>
      <section class="painel-tela" id="tela-perfil"></section>
      <section class="painel-tela" id="tela-producao"></section>
      <section class="painel-tela" id="tela-estoque"></section>
      <section class="painel-tela" id="tela-financeiro"></section>
      <section class="painel-tela" id="tela-indicadores"></section>
      <section class="painel-tela" id="tela-admin"></section>
    </main>
  </div>

  <nav class="nav-inferior-mobile" id="nav-inferior-mobile"></nav>
</div>

<div id="camada-modal">
  <div class="modal">
    <button class="fechar-modal" onclick="fecharModal()" id="icone-fechar-modal"></button>
    <div id="conteudo-modal"></div>
  </div>
</div>

<div id="area-impressao"></div>

function iconeInline(nome, tamanho){ return ic(ICONES[nome] || '', tamanho); }
function iniciais(nome){ return (nome||'').split(' ').filter(Boolean).slice(0,2).map(p=>p[0]).join('').toUpperCase(); }
function escaparHTML(str){ return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

function baixarCSV(nomeArquivo, colunas, linhas){
  const cabecalho = colunas.join(';');
  const corpo = linhas.map(l => colunas.map(c => {
    let v = l[c];
    if(v === null || v === undefined) v = '';
    v = String(v).replace(/"/g,'""');
    if(v.indexOf(';') !== -1 || v.indexOf('"') !== -1 || v.indexOf('\n') !== -1) v = '"'+v+'"';
    return v;
  }).join(';')).join('\n');
  const csv = cabecalho + '\n' + corpo;
  const blob = new Blob(['\uFEFF'+csv], { type:'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = nomeArquivo;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function mostrarMensagemLogin(msg, tipo){
  const el = document.getElementById('mensagem-login');
  el.textContent = msg || '';
  el.style.color = tipo === 'erro' ? 'var(--perigo)' : 'var(--tinta-suave)';
}

function traduzErroAuth(msg){
  if(/Invalid login credentials/i.test(msg)) return 'E-mail ou senha incorretos.';
  if(/User already registered/i.test(msg)) return 'Já existe uma conta com esse e-mail. Tente entrar em vez de criar conta.';
  if(/Email not confirmed/i.test(msg)) return 'Confirme seu e-mail antes de entrar (veja sua caixa de entrada).';
  if(/Password should be at least/i.test(msg)) return 'A senha precisa ter pelo menos 6 caracteres.';
  return msg;
}

async function entrarComEmail(){
  const email = document.getElementById('input-email').value.trim();
  const senha = document.getElementById('input-senha').value;
  if(!email || !senha){ mostrarMensagemLogin('Preencha e-mail e senha.', 'erro'); return; }
  mostrarMensagemLogin('Entrando...');
  const { error } = await sb.auth.signInWithPassword({ email, password: senha });
  if(error){ mostrarMensagemLogin(traduzErroAuth(error.message), 'erro'); return; }
  await iniciarApp();
}

async function criarContaComEmail(){
  const nome = document.getElementById('input-nome').value.trim();
  const email = document.getElementById('input-email').value.trim();
  const senha = document.getElementById('input-senha').value;
  if(!nome){ mostrarMensagemLogin('Preencha seu nome para criar a conta.', 'erro'); return; }
  if(!email || !senha){ mostrarMensagemLogin('Preencha e-mail e senha.', 'erro'); return; }
  if(!document.getElementById('input-aceite-termos').checked){ mostrarMensagemLogin('Você precisa aceitar os termos de uso para criar sua conta.', 'erro'); return; }
  aceiteDeTermosNoCadastro = true;
  mostrarMensagemLogin('Criando conta...');
  const { data, error } = await sb.auth.signUp({ email, password: senha, options:{ data:{ nome } } });
  if(error){ mostrarMensagemLogin(traduzErroAuth(error.message), 'erro'); return; }
  if(!data.session){
    mostrarMensagemLogin('Conta criada! Verifique seu e-mail para confirmar antes de entrar.');
    return;
  }
  await iniciarApp();
}

async function carregarOuCriarPerfilProdutor(){

  const nomeInicial = (usuarioAtual.user_metadata && usuarioAtual.user_metadata.nome) || usuarioAtual.email.split('@')[0];

  const { data: criado, error: erroCriar } = await sb.from('produtores')
    .insert(novoPerfil)
    .select()
    .maybeSingle();

    b.classList.toggle('ativo', b.dataset.aba === id);
  });

  if(id === 'tela-animais') renderAnimais();
  if(id === 'tela-producao') renderProducao();

const TIPOS_EVENTO = {
  cio: 'Cio',
  cobertura: 'Cobertura / Inseminação',
  parto: 'Parto',
  secagem: 'Secagem'
};
const DIAS_GESTACAO = 283;
const DIAS_LACTACAO_ATE_SECAGEM = 305;

function somarDias(dataIso, dias){
  const d = new Date(dataIso + 'T00:00:00');
  d.setDate(d.getDate() + dias);
  return d.toISOString().slice(0,10);
}

async function renderHistoricoReprodutivo(animalId){
  const alvo = document.getElementById('secao-reprodutivo');
  if(!alvo) return;
  const { data, error } = await sb.from('eventos_reprodutivos').select('*').eq('animal_id', animalId).order('data', { ascending:false });
  if(error){
    alvo.innerHTML = '<div class="legenda-muted">Não foi possível carregar o histórico: '+error.message+'</div>';
    return;
  }

  let previsaoHTML = '';
  if(data.length > 0){
    const maisRecente = data[0];
    if(maisRecente.tipo === 'cobertura'){
      previsaoHTML = '<div class="cartao" style="background:var(--creme-alt); border-color:var(--manteiga)"><strong>Previsão de parto:</strong> '+formatarData(somarDias(maisRecente.data, DIAS_GESTACAO))+'</div>';
    } else if(maisRecente.tipo === 'parto'){
      previsaoHTML = '<div class="cartao" style="background:var(--creme-alt); border-color:var(--manteiga)"><strong>Previsão de secagem:</strong> '+formatarData(somarDias(maisRecente.data, DIAS_LACTACAO_ATE_SECAGEM))+'</div>';
    }
  }

  const lista = data.map(ev=>
    '<div class="cartao" style="display:flex; align-items:center; gap:12px; margin-bottom:8px">'
    + '<div style="flex:1"><strong>'+TIPOS_EVENTO[ev.tipo]+'</strong><div class="legenda-muted" style="margin-bottom:0; font-size:13px">'+formatarData(ev.data)+(ev.observacoes ? ' · '+escaparHTML(ev.observacoes) : '')+'</div></div>'
    + '<button class="botao-perigo-fino" style="margin-top:0" onclick="excluirEventoReprodutivo('+ev.id+','+animalId+')">'+iconeInline('lixo',15)+'</button>'
    + '</div>'
  ).join('');

  alvo.innerHTML = previsaoHTML
    + (data.length ? lista : '<div class="legenda-muted">Nenhum evento registrado ainda.</div>')
    + '<button class="botao botao-secundario botao-bloco" onclick="abrirFormularioEvento('+animalId+')">'+iconeInline('coracao',18)+' Adicionar evento reprodutivo</button>';

function formatarData(iso){
  if(!iso) return '';
  const [ano,mes,dia] = iso.split('-');
  return dia+'/'+mes+'/'+ano;
}

/* ======================= QUALIDADE DO LEITE (CCS/CBT) ======================= */
let QUALIDADE_LEITE = [];
const LIMITE_CCS = 500000; // células/mL — IN 76/77 MAPA (máximo, média geom. trimestral)
const LIMITE_CBT = 300000; // UFC/mL — IN 76/77 MAPA (máximo, média geom. trimestral)
const MINIMO_GORDURA = 3.0; // g/100g — IN 76/2018, Art. 5º (mínimo)
const MINIMO_PROTEINA = 2.9; // g/100g — IN 76/2018, Art. 5º (mínimo)

function mediaGeometrica(valores){
  const validos = valores.map(Number).filter(v => v > 0);
  if(!validos.length) return null;
  const somaLog = validos.reduce((s,v)=>s+Math.log(v),0);
  return Math.exp(somaLog/validos.length);
}

function mediaSimples(valores){
  const validos = valores.map(Number).filter(v => !isNaN(v) && v > 0);
  if(!validos.length) return null;
  return validos.reduce((s,v)=>s+v,0)/validos.length;
}

function registrosNoPeriodo(registros, dataFim, dias){
  const inicio = somarDias(dataFim, -dias);
  return registros.filter(r => r.data >= inicio && r.data <= dataFim);
}

function calcularStatusQualidade(registros, dataRef){
  const ref = dataRef || new Date().toISOString().slice(0,10);
  const periodo = registrosNoPeriodo(registros || [], ref, 90);
  const mediaCCS = mediaGeometrica(periodo.map(r=>r.ccs).filter(v=>v!==null && v!==undefined));
  const mediaCBT = mediaGeometrica(periodo.map(r=>r.cbt).filter(v=>v!==null && v!==undefined));
  const mediaGordura = mediaSimples(periodo.map(r=>r.gordura).filter(v=>v!==null && v!==undefined));
  const mediaProteina = mediaSimples(periodo.map(r=>r.proteina).filter(v=>v!==null && v!==undefined));

  const razaoCCS = mediaCCS!==null ? mediaCCS/LIMITE_CCS : 0;
  const razaoCBT = mediaCBT!==null ? mediaCBT/LIMITE_CBT : 0;
  const razaoGordura = mediaGordura!==null ? MINIMO_GORDURA/mediaGordura : 0;
  const razaoProteina = mediaProteina!==null ? MINIMO_PROTEINA/mediaProteina : 0;

  const pior = Math.max(razaoCCS, razaoCBT, razaoGordura, razaoProteina);
  const nivel = pior >= 1 ? 'alerta' : (pior >= 0.9 ? 'atencao' : 'ok');
  return { mediaCCS, mediaCBT, mediaGordura, mediaProteina, nivel, registros: periodo.length };
}

function formatarNumero(v){ return v===null||v===undefined||v==='' ? '—' : Number(v).toLocaleString('pt-BR'); }
function formatarPercentual(v){ return v===null||v===undefined||v==='' ? '—' : Number(v).toLocaleString('pt-BR',{minimumFractionDigits:1, maximumFractionDigits:2})+'%'; }

async function salvarQualidade(id){
  const data = document.getElementById('campo-data-qualidade').value;
  const ccsVal = document.getElementById('campo-ccs').value;
  const cbtVal = document.getElementById('campo-cbt').value;
  const gorduraVal = document.getElementById('campo-gordura').value;
  const proteinaVal = document.getElementById('campo-proteina').value;
  const observacoes = document.getElementById('campo-obs-qualidade').value.trim();
  const msg = document.getElementById('mensagem-qualidade');

  if(!data){ msg.textContent = 'Preencha a data do resultado.'; msg.style.color = 'var(--perigo)'; return; }
  if(!ccsVal && !cbtVal && !gorduraVal && !proteinaVal){ msg.textContent = 'Informe ao menos um dos valores.'; msg.style.color = 'var(--perigo)'; return; }

  const ccs = ccsVal ? Number(ccsVal) : null;
  const cbt = cbtVal ? Number(cbtVal) : null;
  const gordura = gorduraVal ? Number(gorduraVal) : null;
  const proteina = proteinaVal ? Number(proteinaVal) : null;

  msg.textContent = 'Salvando...';
  msg.style.color = 'var(--tinta-suave)';

  const payload = { produtor_id: usuarioAtual.id, data, ccs, cbt, gordura, proteina, observacoes };

    ? await sb.from('qualidade_leite').update(payload).eq('id', id)

  if(error){ msg.textContent = 'Não foi possível salvar: ' + error.message; msg.style.color = 'var(--perigo)'; return; }

  fecharModal();
  renderProducao();
}

/* ======================= CALENDÁRIO DE ATIVIDADES (exibido na tela de Início) ======================= */
async function buscarAlertasCalendario(){
  const [{ data: meusAnimais, error: erroAnimais }, { data: eventosRepro, error: erroRepro }, { data: eventosSan, error: erroSan }] = await Promise.all([
    sb.from('animais').select('id, identificacao').eq('produtor_id', usuarioAtual.id),
    sb.from('eventos_reprodutivos').select('*').eq('produtor_id', usuarioAtual.id).order('data', { ascending:true }),
    sb.from('eventos_sanitarios').select('*').eq('produtor_id', usuarioAtual.id).not('data_fim_carencia', 'is', null)
  ]);

  if(erroAnimais || erroRepro || erroSan){
    return [];
  }

  const mapaAnimais = {};
  meusAnimais.forEach(a => { mapaAnimais[a.id] = a.identificacao; });

  const ultimoEventoPorAnimal = {};
  eventosRepro.forEach(ev => { ultimoEventoPorAnimal[ev.animal_id] = ev; }); // como veio ordenado asc, o último sobrescreve e fica o mais recente

  const alertas = [];

  Object.values(ultimoEventoPorAnimal).forEach(ev => {
    if(ev.tipo === 'cobertura'){
      alertas.push({ data: somarDias(ev.data, DIAS_GESTACAO), titulo: 'Previsão de parto', animal: mapaAnimais[ev.animal_id] });
    } else if(ev.tipo === 'parto'){
      alertas.push({ data: somarDias(ev.data, DIAS_LACTACAO_ATE_SECAGEM), titulo: 'Previsão de secagem', animal: mapaAnimais[ev.animal_id] });
    }
  });

  eventosSan.forEach(ev => {
    alertas.push({ data: ev.data_fim_carencia, titulo: 'Fim da carência — '+(TIPOS_SANITARIO[ev.tipo]||ev.tipo)+(ev.descricao ? ' ('+ev.descricao+')' : ''), animal: mapaAnimais[ev.animal_id] });
  });

  alertas.sort((a,b) => a.data.localeCompare(b.data));
  return alertas;
}

async function salvarMovimentoEstoque(itemId, tipo){
  const quantidade = Number(document.getElementById('campo-quantidade-mov').value);
  const data = document.getElementById('campo-data-mov').value;
  const observacoes = document.getElementById('campo-obs-mov').value.trim();
  const msg = document.getElementById('mensagem-mov');

  if(!quantidade || quantidade <= 0){ msg.textContent = 'Informe uma quantidade válida.'; msg.style.color = 'var(--perigo)'; return; }
  if(!data){ msg.textContent = 'Preencha a data.'; msg.style.color = 'var(--perigo)'; return; }

  msg.textContent = 'Salvando...';
  msg.style.color = 'var(--tinta-suave)';

  const { error: erroMov } = await sb.from('estoque_movimentacoes').insert({
    item_id: itemId, produtor_id: usuarioAtual.id, tipo, quantidade, data, observacoes
  });
  if(erroMov){ msg.textContent = 'Não foi possível salvar: ' + erroMov.message; msg.style.color = 'var(--perigo)'; return; }

  const item = MEU_ESTOQUE.find(i=>i.id===itemId);
  const novoSaldo = tipo === 'entrada' ? Number(item.quantidade_atual) + quantidade : Number(item.quantidade_atual) - quantidade;
  const { error: erroItem } = await sb.from('estoque_itens').update({ quantidade_atual: novoSaldo }).eq('id', itemId);
  if(erroItem){ msg.textContent = 'Movimento salvo, mas não foi possível atualizar o saldo: ' + erroItem.message; msg.style.color = 'var(--perigo)'; return; }

  item.quantidade_atual = novoSaldo;
  abrirDetalheItemEstoque(itemId);
}

async function excluirItemEstoque(id){
  if(!confirm('Excluir este item e todo o histórico de movimentações dele?')) return;
  const { error } = await sb.from('estoque_itens').delete().eq('id', id);
  if(error){ alert('Não foi possível excluir: ' + error.message); return; }
  fecharModal();
  renderEstoque();
}

/* ======================= FINANCEIRO (privado do produtor) ======================= */
const CATEGORIAS_RECEITA = ['Venda de leite','Venda de animais','Outros'];
const CATEGORIAS_DESPESA = ['Ração','Medicamentos/Veterinário','Sêmen/Reprodução','Combustível','Mão de obra','Manutenção','Outros'];
let MEUS_LANCAMENTOS = [];

async function renderFinanceiro(){
  document.getElementById('tela-financeiro').innerHTML = '<div class="legenda-muted">Carregando financeiro...</div>';
  const { data, error } = await sb.from('financeiro_lancamentos').select('*').eq('produtor_id', usuarioAtual.id).order('data', { ascending:false });
  if(error){
    document.getElementById('tela-financeiro').innerHTML = '<div class="rotulo-secao" style="margin-top:0">Financeiro</div><div class="legenda-muted">Não foi possível carregar: '+error.message+'</div>';
    return;
  }
  MEUS_LANCAMENTOS = data;

  const totalReceitas = data.filter(l=>l.tipo==='receita').reduce((s,l)=>s+Number(l.valor),0);
  const totalDespesas = data.filter(l=>l.tipo==='despesa').reduce((s,l)=>s+Number(l.valor),0);
  const saldo = totalReceitas - totalDespesas;

  const resumo = '<div class="cartao" style="display:flex; justify-content:space-around; text-align:center">'
    + '<div><div class="legenda-muted" style="font-size:12px; margin-bottom:2px">Receitas</div><div style="font-weight:700; color:var(--sucesso)">R$ '+totalReceitas.toFixed(2)+'</div></div>'
    + '<div><div class="legenda-muted" style="font-size:12px; margin-bottom:2px">Despesas</div><div style="font-weight:700; color:var(--perigo)">R$ '+totalDespesas.toFixed(2)+'</div></div>'
    + '<div><div class="legenda-muted" style="font-size:12px; margin-bottom:2px">Saldo</div><div style="font-weight:700">R$ '+saldo.toFixed(2)+'</div></div>'
    + '</div>';

  const cabecalho = '<div class="rotulo-secao" style="margin-top:0">Financeiro</div>'
    + '<div class="legenda-muted">Este módulo é privado — somente você tem acesso aos seus dados financeiros.</div>'
    + resumo
    + '<button class="botao botao-primario" style="margin:14px 0 18px" onclick="abrirNovoLancamento()">'+iconeInline('moeda',18)+' Novo lançamento</button>';

  if(data.length === 0){
    document.getElementById('tela-financeiro').innerHTML = cabecalho
      + '<div class="estado-vazio"><div class="ic">'+iconeInline('moeda',28)+'</div><p>Nenhum lançamento ainda. Registre receitas (ex: venda de leite) e despesas (ex: ração) para acompanhar seu fluxo de caixa.</p></div>';
    return;
  }

  const linhas = data.map(l=>
    '<button class="cartao" style="width:100%; text-align:left; display:flex; align-items:center; gap:14px; cursor:pointer" onclick="abrirEdicaoLancamento('+l.id+')">'
    + '<div class="avatar" style="background:'+(l.tipo==='receita' ? 'var(--pasto)' : 'var(--perigo)')+'; color:var(--branco)">'+iconeInline('moeda',18)+'</div>'
    + '<div style="flex:1"><strong>'+escaparHTML(l.categoria)+'</strong>'
    + '<div class="legenda-muted" style="margin-bottom:0; font-size:13px">'+formatarData(l.data)+(l.descricao ? ' · '+escaparHTML(l.descricao) : '')+'</div></div>'
    + '<span style="font-weight:700; color:'+(l.tipo==='receita' ? 'var(--sucesso)' : 'var(--perigo)')+'">'+(l.tipo==='receita' ? '+' : '−')+' R$ '+Number(l.valor).toFixed(2)+'</span>'
    + '</button>'
  ).join('');

  document.getElementById('tela-financeiro').innerHTML = cabecalho + linhas;
}

function opcoesCategoriaFinanceiro(tipo, selecionada){
  const lista = tipo === 'receita' ? CATEGORIAS_RECEITA : CATEGORIAS_DESPESA;
  return lista.map(c=>'<option value="'+c+'" '+(c===selecionada?'selected':'')+'>'+c+'</option>').join('');
}

function atualizarCategoriasFinanceiro(){
  const tipo = document.getElementById('campo-tipo-lancamento').value;
  document.getElementById('campo-categoria-lancamento').innerHTML = opcoesCategoriaFinanceiro(tipo);
}

function abrirNovoLancamento(){
  const hoje = new Date().toISOString().slice(0,10);
  document.getElementById('conteudo-modal').innerHTML =
    '<div class="rotulo-secao" style="margin-top:0">Novo lançamento</div>'
    + '<div class="grupo-campo"><label for="campo-tipo-lancamento">Tipo</label><select id="campo-tipo-lancamento" onchange="atualizarCategoriasFinanceiro()"><option value="receita">Receita</option><option value="despesa">Despesa</option></select></div>'
    + '<div class="grupo-campo"><label for="campo-categoria-lancamento">Categoria</label><select id="campo-categoria-lancamento">'+opcoesCategoriaFinanceiro('receita')+'</select></div>'
    + '<div class="grupo-campo"><label for="campo-valor-lancamento">Valor (R$)</label><input id="campo-valor-lancamento" type="number" step="0.01" min="0"></div>'
    + '<div class="grupo-campo"><label for="campo-data-lancamento">Data</label><input id="campo-data-lancamento" type="date" value="'+hoje+'"></div>'
    + '<div class="grupo-campo"><label for="campo-descricao-lancamento">Descrição (opcional)</label><input id="campo-descricao-lancamento" type="text"></div>'
    + '<div id="mensagem-lancamento" class="legenda-muted" style="min-height:18px"></div>'
    + '<button class="botao botao-primario botao-bloco" onclick="salvarNovoLancamento()">Salvar</button>';
  abrirModal();
}

async function salvarNovoLancamento(){
  const tipo = document.getElementById('campo-tipo-lancamento').value;
  const categoria = document.getElementById('campo-categoria-lancamento').value;
  const valor = Number(document.getElementById('campo-valor-lancamento').value);
  const data = document.getElementById('campo-data-lancamento').value;
  const descricao = document.getElementById('campo-descricao-lancamento').value.trim();
  const msg = document.getElementById('mensagem-lancamento');

  if(!valor || valor <= 0){ msg.textContent = 'Informe um valor válido.'; msg.style.color = 'var(--perigo)'; return; }
  if(!data){ msg.textContent = 'Preencha a data.'; msg.style.color = 'var(--perigo)'; return; }

  msg.textContent = 'Salvando...';
  msg.style.color = 'var(--tinta-suave)';

  const { error } = await sb.from('financeiro_lancamentos').insert({ produtor_id: usuarioAtual.id, tipo, categoria, valor, data, descricao });

  if(error){ msg.textContent = 'Não foi possível salvar: ' + error.message; msg.style.color = 'var(--perigo)'; return; }

  fecharModal();
  renderFinanceiro();
}

function abrirEdicaoLancamento(id){
  const l = MEUS_LANCAMENTOS.find(x=>x.id===id);
  if(!l) return;
  document.getElementById('conteudo-modal').innerHTML =
    '<div class="rotulo-secao" style="margin-top:0">Editar lançamento</div>'
    + '<div class="grupo-campo"><label for="campo-tipo-lancamento">Tipo</label><select id="campo-tipo-lancamento" onchange="atualizarCategoriasFinanceiro()"><option value="receita" '+(l.tipo==='receita'?'selected':'')+'>Receita</option><option value="despesa" '+(l.tipo==='despesa'?'selected':'')+'>Despesa</option></select></div>'
    + '<div class="grupo-campo"><label for="campo-categoria-lancamento">Categoria</label><select id="campo-categoria-lancamento">'+opcoesCategoriaFinanceiro(l.tipo, l.categoria)+'</select></div>'
    + '<div class="grupo-campo"><label for="campo-valor-lancamento">Valor (R$)</label><input id="campo-valor-lancamento" type="number" step="0.01" min="0" value="'+l.valor+'"></div>'
    + '<div class="grupo-campo"><label for="campo-data-lancamento">Data</label><input id="campo-data-lancamento" type="date" value="'+l.data+'"></div>'
    + '<div class="grupo-campo"><label for="campo-descricao-lancamento">Descrição (opcional)</label><input id="campo-descricao-lancamento" type="text" value="'+escaparHTML(l.descricao||'')+'"></div>'
    + '<div id="mensagem-lancamento" class="legenda-muted" style="min-height:18px"></div>'
    + '<button class="botao botao-primario botao-bloco" onclick="salvarEdicaoLancamento('+l.id+')">Salvar alterações</button>'

  abrirModal();
}

async function salvarEdicaoLancamento(id){
  const tipo = document.getElementById('campo-tipo-lancamento').value;
  const categoria = document.getElementById('campo-categoria-lancamento').value;
  const valor = Number(document.getElementById('campo-valor-lancamento').value);
  const data = document.getElementById('campo-data-lancamento').value;
  const descricao = document.getElementById('campo-descricao-lancamento').value.trim();

  if(!valor || valor <= 0){ msg.textContent = 'Informe um valor válido.'; msg.style.color = 'var(--perigo)'; return; }

  msg.textContent = 'Salvando...';
  msg.style.color = 'var(--tinta-suave)';

  const { error } = await sb.from('financeiro_lancamentos').update({ tipo, categoria, valor, data, descricao }).eq('id', id);

  if(error){ msg.textContent = 'Não foi possível salvar: ' + error.message; msg.style.color = 'var(--perigo)'; return; }

  fecharModal();
  renderFinanceiro();

async function excluirLancamento(id){
  if(!confirm('Excluir este lançamento?')) return;
  const { error } = await sb.from('financeiro_lancamentos').delete().eq('id', id);
  if(error){ alert('Não foi possível excluir: ' + error.message); return; }
  fecharModal();
  renderFinanceiro();

/* ======================= INDICADORES (produtor) ======================= */
function diasEntre(dataIsoA, dataIsoB){
  const a = new Date(dataIsoA + 'T00:00:00');
  const b = new Date(dataIsoB + 'T00:00:00');
  return Math.round((b - a) / (1000*60*60*24));
}

async function renderIndicadores(){
  document.getElementById('tela-indicadores').innerHTML = '<div class="legenda-muted">Calculando indicadores...</div>';

  const hoje = new Date().toISOString().slice(0,10);
  const inicioMes = hoje.slice(0,8) + '01';

  const [
    { data: producao, error: erroProducao },
    { data: animais, error: erroAnimais },
    { data: eventos, error: erroEventos },
    { data: lancamentos, error: erroLancamentos },
    { data: qualidade, error: erroQualidade }
  ] = await Promise.all([
    sb.from('producao_leite').select('*').eq('produtor_id', usuarioAtual.id).order('data', { ascending:false }),
    sb.from('animais').select('id, identificacao').eq('produtor_id', usuarioAtual.id),
    sb.from('eventos_reprodutivos').select('*').eq('produtor_id', usuarioAtual.id).order('data', { ascending:true }),
    sb.from('financeiro_lancamentos').select('*').eq('produtor_id', usuarioAtual.id),
    sb.from('qualidade_leite').select('*').eq('produtor_id', usuarioAtual.id).order('data', { ascending:false })
  ]);

  if(erroProducao || erroAnimais || erroEventos || erroLancamentos || erroQualidade){
    document.getElementById('tela-indicadores').innerHTML = '<div class="rotulo-secao" style="margin-top:0">Indicadores</div><div class="legenda-muted">Não foi possível calcular os indicadores agora.</div>';
    return;
  }

  /* --- Produção: médias e gráfico --- */
  const totalDia = r => Number(r.litros_manha||0) + Number(r.litros_tarde||0);
  const ultimos7 = producao.slice(0,7);
  const ultimos30 = producao.slice(0,30);
  const media7 = ultimos7.length ? (ultimos7.reduce((s,r)=>s+totalDia(r),0)/ultimos7.length) : 0;
  const media30 = ultimos30.length ? (ultimos30.reduce((s,r)=>s+totalDia(r),0)/ultimos30.length) : 0;

  const paraGrafico = producao.slice(0,14).slice().reverse();
  const maxGrafico = Math.max(1, ...paraGrafico.map(totalDia));
  const barras = paraGrafico.map(r=>{
    const altura = Math.round((totalDia(r)/maxGrafico)*80) + 4;
    return '<div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:4px">'
      + '<div style="width:100%; max-width:22px; height:'+altura+'px; background:var(--azul); border-radius:4px 4px 0 0"></div>'
      + '<div style="font-size:9px; color:var(--tinta-suave); writing-mode:vertical-rl; transform:rotate(180deg); height:34px">'+formatarData(r.data).slice(0,5)+'</div>'
      + '</div>';
  }).join('');

  const blocoProducao = '<div class="rotulo-secao" style="margin-top:0">Produção de leite</div>'
    + '<div class="cartao" style="display:flex; justify-content:space-around; text-align:center">'
      + '<div><div class="legenda-muted" style="font-size:12px; margin-bottom:2px">Média (7 dias)</div><div style="font-weight:700; font-size:18px">'+media7.toFixed(1)+' L</div></div>'
      + '<div><div class="legenda-muted" style="font-size:12px; margin-bottom:2px">Média (30 dias)</div><div style="font-weight:700; font-size:18px">'+media30.toFixed(1)+' L</div></div>'
    + '</div>'
    + (paraGrafico.length ? '<div class="cartao"><div class="legenda-muted" style="margin-bottom:10px">Últimos 14 registros (litros/dia)</div><div style="display:flex; align-items:flex-end; gap:6px; height:120px">'+barras+'</div></div>' : '<div class="legenda-muted">Sem registros de produção suficientes para o gráfico.</div>');

  /* --- Reprodutivo: DEL e IEP por animal --- */
  const eventosPorAnimal = {};
  eventos.forEach(ev=>{ (eventosPorAnimal[ev.animal_id] = eventosPorAnimal[ev.animal_id] || []).push(ev); });

  const linhasReprodutivo = animais.map(a=>{
    const evs = eventosPorAnimal[a.id] || [];
    const partos = evs.filter(e=>e.tipo==='parto').sort((x,y)=>x.data.localeCompare(y.data));
    const secagens = evs.filter(e=>e.tipo==='secagem').sort((x,y)=>x.data.localeCompare(y.data));

    let del = '—';
    if(partos.length){
      const ultimoParto = partos[partos.length-1];
      const secagemDepois = secagens.find(s=>s.data > ultimoParto.data);
      if(!secagemDepois) del = diasEntre(ultimoParto.data, hoje) + ' dias';
    }

    let iep = '—';
    if(partos.length >= 2){
      const p1 = partos[partos.length-2], p2 = partos[partos.length-1];
      iep = diasEntre(p1.data, p2.data) + ' dias';
    }

    if(partos.length === 0 && del === '—' && iep === '—') return null;

    return '<tr><td>Nº '+escaparHTML(a.identificacao)+'</td><td>'+del+'</td><td>'+iep+'</td></tr>';
  }).filter(Boolean).join('');

  const blocoReprodutivo = '<div class="rotulo-secao">Reprodutivo (por animal)</div>'
    + (linhasReprodutivo
      ? '<div class="cartao"><table class="tabela-admin"><thead><tr><th>Animal</th><th>DEL (dias em lactação)</th><th>IEP (intervalo entre partos)</th></tr></thead><tbody>'+linhasReprodutivo+'</tbody></table></div>'
      : '<div class="legenda-muted">Nenhum animal com parto registrado ainda.</div>');

  /* --- Financeiro: custo por litro (mês atual) --- */
  const despesasMes = lancamentos.filter(l=>l.tipo==='despesa' && l.data >= inicioMes).reduce((s,l)=>s+Number(l.valor),0);
  const litrosMes = producao.filter(r=>r.data >= inicioMes).reduce((s,r)=>s+totalDia(r),0);
  const custoLitro = litrosMes > 0 ? (despesasMes/litrosMes) : null;

  const blocoFinanceiro = '<div class="rotulo-secao">Custo por litro (mês atual)</div>'
    + '<div class="cartao" style="display:flex; justify-content:space-around; text-align:center">'
      + '<div><div class="legenda-muted" style="font-size:12px; margin-bottom:2px">Despesas no mês</div><div style="font-weight:700">R$ '+despesasMes.toFixed(2)+'</div></div>'
      + '<div><div class="legenda-muted" style="font-size:12px; margin-bottom:2px">Litros no mês</div><div style="font-weight:700">'+litrosMes.toFixed(1)+' L</div></div>'
      + '<div><div class="legenda-muted" style="font-size:12px; margin-bottom:2px">Custo por litro</div><div style="font-weight:700; color:var(--azul)">'+(custoLitro!==null ? 'R$ '+custoLitro.toFixed(2) : '—')+'</div></div>'
    + '</div>';

  /* --- Qualidade do leite: CCS, CBT, gordura e proteína --- */
  const statusQual = calcularStatusQualidade(qualidade||[], hoje);
  const corQual = statusQual.nivel==='alerta' ? 'var(--perigo)' : (statusQual.nivel==='atencao' ? 'var(--manteiga-escura)' : 'var(--sucesso)');
  const textoQual = statusQual.nivel==='alerta' ? 'Fora do limite' : (statusQual.nivel==='atencao' ? 'Próximo do limite' : (statusQual.registros ? 'Dentro do limite' : 'Sem resultados'));

  const blocoQualidade = '<div class="rotulo-secao">Qualidade do leite (CCS, CBT, gordura e proteína)</div>'
    + '<div class="cartao" style="border-color:'+corQual+'">'
      + '<div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(100px,1fr)); gap:10px; text-align:center; margin-bottom:8px">'
        + '<div><div class="legenda-muted" style="font-size:12px; margin-bottom:2px">CCS (méd. geom. 90d)</div><div style="font-weight:700">'+(statusQual.mediaCCS!==null ? formatarNumero(Math.round(statusQual.mediaCCS)) : '—')+'</div></div>'
        + '<div><div class="legenda-muted" style="font-size:12px; margin-bottom:2px">CBT (méd. geom. 90d)</div><div style="font-weight:700">'+(statusQual.mediaCBT!==null ? formatarNumero(Math.round(statusQual.mediaCBT)) : '—')+'</div></div>'
        + '<div><div class="legenda-muted" style="font-size:12px; margin-bottom:2px">Gordura (méd. 90d)</div><div style="font-weight:700">'+formatarPercentual(statusQual.mediaGordura)+'</div></div>'
        + '<div><div class="legenda-muted" style="font-size:12px; margin-bottom:2px">Proteína (méd. 90d)</div><div style="font-weight:700">'+formatarPercentual(statusQual.mediaProteina)+'</div></div>'
      + '</div>'
      + '<div style="text-align:center; font-weight:700; color:'+corQual+'">'+textoQual+'</div>'
    + '</div>';

  document.getElementById('tela-indicadores').innerHTML =
    '<div class="rotulo-secao" style="margin-top:0">Indicadores</div>'
    + blocoProducao + blocoReprodutivo + blocoFinanceiro + blocoQualidade
    + blocoRelatorios();
}

function blocoRelatorios(){
  const hoje = new Date().toISOString().slice(0,10);
  const trintaDiasAtras = somarDias(hoje, -30);
  return '<div class="rotulo-secao">Relatórios</div>'
    + '<div class="cartao">'
      + '<div class="grupo-campo"><label for="campo-relatorio-inicio">Período — de</label><input id="campo-relatorio-inicio" type="date" value="'+trintaDiasAtras+'"></div>'
      + '<div class="grupo-campo"><label for="campo-relatorio-fim">Até</label><input id="campo-relatorio-fim" type="date" value="'+hoje+'"></div>'
      + '<div style="display:flex; gap:10px; flex-wrap:wrap">'
        + '<button class="botao botao-secundario" onclick="exportarCSVProdutor()">Baixar CSV</button>'
        + '<button class="botao botao-primario" onclick="gerarPDFProdutor()">Gerar relatório PDF</button>'
      + '</div>'
    + '</div>';
}

async function exportarCSVProdutor(){
  const inicio = document.getElementById('campo-relatorio-inicio').value;
  const fim = document.getElementById('campo-relatorio-fim').value;
  const { data, error } = await sb.from('producao_leite').select('*').eq('produtor_id', usuarioAtual.id).gte('data', inicio).lte('data', fim).order('data', { ascending:true });
  if(error){ alert('Não foi possível gerar o CSV: ' + error.message); return; }
  const linhas = data.map(r=>({ data:r.data, litros_manha:r.litros_manha||0, litros_tarde:r.litros_tarde||0, total:(Number(r.litros_manha||0)+Number(r.litros_tarde||0)) }));
  baixarCSV('leitefacil_producao_'+inicio+'_a_'+fim+'.csv', ['data','litros_manha','litros_tarde','total'], linhas);
}

async function gerarPDFProdutor(){
  const inicio = document.getElementById('campo-relatorio-inicio').value;
  const fim = document.getElementById('campo-relatorio-fim').value;

  const [{ data: producao }, { data: animais }, { data: eventosRepro }, { data: eventosSan }, { data: lancamentos }, { data: qualidade }] = await Promise.all([
    sb.from('producao_leite').select('*').eq('produtor_id', usuarioAtual.id).gte('data', inicio).lte('data', fim).order('data', { ascending:true }),
    sb.from('animais').select('*').eq('produtor_id', usuarioAtual.id),
    sb.from('eventos_reprodutivos').select('*, animais(identificacao)').eq('produtor_id', usuarioAtual.id).gte('data', inicio).lte('data', fim).order('data', { ascending:true }),
    sb.from('eventos_sanitarios').select('*, animais(identificacao)').eq('produtor_id', usuarioAtual.id).gte('data_aplicacao', inicio).lte('data_aplicacao', fim).order('data_aplicacao', { ascending:true }),
    sb.from('financeiro_lancamentos').select('*').eq('produtor_id', usuarioAtual.id).gte('data', inicio).lte('data', fim).order('data', { ascending:true }),
    sb.from('qualidade_leite').select('*').eq('produtor_id', usuarioAtual.id).gte('data', inicio).lte('data', fim).order('data', { ascending:true })
  ]);

  const totalLitros = (producao||[]).reduce((s,r)=>s+Number(r.litros_manha||0)+Number(r.litros_tarde||0),0);
  const totalReceitas = (lancamentos||[]).filter(l=>l.tipo==='receita').reduce((s,l)=>s+Number(l.valor),0);
  const totalDespesas = (lancamentos||[]).filter(l=>l.tipo==='despesa').reduce((s,l)=>s+Number(l.valor),0);

    + '</tbody></table>';

  imprimirRelatorio('Relatório LeiteFácil', conteudo);
}

async function renderAdmin(){
  document.getElementById('tela-admin').innerHTML = '<div class="legenda-muted">Carregando produtores...</div>';
  const hoje = new Date().toISOString().slice(0,10);
  const seteDiasAtras = somarDias(hoje, -7);
  const [
    { data, error },
    { data: animaisTodos, error: erroAnimais },
    { data: producaoRecente, error: erroProducao },
    { data: carenciasAtivas, error: erroCarencias },
    { data: qualidadeRecente, error: erroQualidadeAdmin }
  ] = await Promise.all([
    sb.from('produtores').select('*').order('criado_em', { ascending:false }),
    sb.from('animais').select('produtor_id'),
    sb.from('producao_leite').select('produtor_id, litros_manha, litros_tarde').gte('data', seteDiasAtras),
    sb.from('eventos_sanitarios').select('animal_id').gte('data_fim_carencia', hoje),
    sb.from('qualidade_leite').select('produtor_id, data, ccs, cbt, gordura, proteina').gte('data', somarDias(hoje, -90))
  ]);
  if(error){
    document.getElementById('tela-admin').innerHTML = '<div class="rotulo-secao" style="margin-top:0">Painel administrativo</div><div class="legenda-muted">Não foi possível carregar os produtores: '+error.message+'</div>';
    return;
  }
  const contagemAnimais = {};
  if(!erroAnimais && animaisTodos){
    animaisTodos.forEach(a => { contagemAnimais[a.produtor_id] = (contagemAnimais[a.produtor_id] || 0) + 1; });
  }

  let producaoTotal7dias = 0;
  const produtoresComProducao = new Set();
  if(!erroProducao && producaoRecente){
    producaoRecente.forEach(r=>{
      producaoTotal7dias += Number(r.litros_manha||0) + Number(r.litros_tarde||0);
      produtoresComProducao.add(r.produtor_id);
    });
  }
  const mediaPorProdutor = produtoresComProducao.size ? (producaoTotal7dias/produtoresComProducao.size) : 0;
  const animaisEmCarencia = (!erroCarencias && carenciasAtivas) ? new Set(carenciasAtivas.map(c=>c.animal_id)).size : 0;
  const totalAnimaisRegiao = Object.values(contagemAnimais).reduce((s,n)=>s+n,0);

  let produtoresQualidadeAlerta = 0;
  if(!erroQualidadeAdmin && qualidadeRecente){
    const porProdutor = {};
    qualidadeRecente.forEach(r => { (porProdutor[r.produtor_id] = porProdutor[r.produtor_id] || []).push(r); });
    Object.values(porProdutor).forEach(regs => {
      if(calcularStatusQualidade(regs, hoje).nivel !== 'ok') produtoresQualidadeAlerta++;
    });
  }

  const cartoesIndicadores = '<div class="grade-estat" style="display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; margin-bottom:20px">'
    + '<div class="cartao-estat"><div class="rot">Produtores</div><div class="num">'+data.length+'</div></div>'
    + '<div class="cartao-estat"><div class="rot">Animais na região</div><div class="num">'+totalAnimaisRegiao+'</div></div>'
    + '<div class="cartao-estat"><div class="rot">Produção (7 dias)</div><div class="num">'+producaoTotal7dias.toFixed(0)+' L</div></div>'
    + '<div class="cartao-estat"><div class="rot">Média/produtor (7 dias)</div><div class="num">'+mediaPorProdutor.toFixed(0)+' L</div></div>'
    + '<div class="cartao-estat"><div class="rot">Animais em carência agora</div><div class="num">'+animaisEmCarencia+'</div></div>'
    + '<div class="cartao-estat"><div class="rot">Produtores c/ qualidade em alerta (90d)</div><div class="num">'+produtoresQualidadeAlerta+'</div></div>'
    + '</div>';

  const linhas = data.map(p=>
    '<tr><td>'+escaparHTML(p.nome||'—')+'</td><td>'+escaparHTML(p.propriedade||'—')+'</td><td>'+escaparHTML(p.cidade||'—')+'</td><td>'+escaparHTML(p.telefone||'—')+'</td><td>'+(contagemAnimais[p.id]||0)+'</td></tr>'
  ).join('');
  document.getElementById('tela-admin').innerHTML =
    '<div class="rotulo-secao" style="margin-top:0">Painel administrativo</div>'
    + '<div class="legenda-muted">Visão geral de todos os produtores cadastrados (exceto dados financeiros, que são privados).</div>'
    + cartoesIndicadores
    + '<div style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px">'
      + '<button class="botao botao-secundario" onclick="exportarCSVAdmin()">Baixar CSV da região</button>'
      + '<button class="botao botao-primario" onclick="gerarPDFAdmin()">Gerar relatório PDF da região</button>'
    + '</div>'
    + '<div class="cartao">'
      + (data.length
        ? '<table class="tabela-admin"><thead><tr><th>Nome</th><th>Propriedade</th><th>Cidade</th><th>Telefone</th><th>Animais</th></tr></thead><tbody>'+linhas+'</tbody></table>'
        : '<div class="legenda-muted" style="margin-bottom:0">Nenhum produtor cadastrado ainda.</div>')
    + '</div>';

  ADMIN_DADOS_ATUAIS = { produtores:data, contagemAnimais, producaoTotal7dias, mediaPorProdutor, animaisEmCarencia, totalAnimaisRegiao };
}

let ADMIN_DADOS_ATUAIS = null;

function exportarCSVAdmin(){
  if(!ADMIN_DADOS_ATUAIS) return;
  const linhas = ADMIN_DADOS_ATUAIS.produtores.map(p=>({
    nome: p.nome||'', propriedade: p.propriedade||'', cidade: p.cidade||'', telefone: p.telefone||'',

  window.addEventListener('load', function(){
    navigator.serviceWorker.register('service-worker.js').catch(function(erro){
      console.error('Falha ao registrar o service worker:', erro);
    });
  });
}
</script>
